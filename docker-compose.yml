# Local development stack — mirrors the GCP topology with emulators. Development/test convenience
# only; the Terraform under infra/ remains the authoritative cloud deployment target.

services:
  # Pub/Sub emulator — stands in for the Queue Layer.
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=opssentinel-mvp
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local PostgreSQL — mirrors the Cloud SQL incident store.
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: opssentinel
      POSTGRES_PASSWORD: opssentinel
      POSTGRES_DB: opssentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opssentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Phase-1 Cloud Run workload, running locally against the emulator.
  webhook-receiver:
    build:
      context: .
      dockerfile: services/webhook-receiver/Dockerfile
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: opssentinel-mvp
      GOOGLE_CLOUD_PROJECT: opssentinel-mvp
      OPSSENTINEL_USE_SECRET_MANAGER: "false"
      OPSSENTINEL_ALERTS_TOPIC: opssentinel-alerts
      PORT: "8080"
    ports:
      - "8000:8080" # host 8000 (MCP servers take the canonical 8080/8081)
    depends_on:
      pubsub-emulator:
        condition: service_healthy

  # Elasticsearch — semantic memory + raw log intake (Phase 2).
  # Pulled from Docker Hub (docker.elastic.co is blocked on some networks).
  elasticsearch:
    image: elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Arize Phoenix — trace collector + self-evaluation (Phase 2).
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

  # Elastic MCP server (SSE /sse).
  mcp-elastic:
    build:
      context: .
      dockerfile: services/mcp-elastic/Dockerfile
    environment:
      OPSSENTINEL_USE_SECRET_MANAGER: "false"
      ELASTIC_URL: http://elasticsearch:9200
    ports:
      - "8080:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Arize Phoenix MCP server (SSE /sse).
  mcp-arize:
    build:
      context: .
      dockerfile: services/mcp-arize/Dockerfile
    environment:
      OPSSENTINEL_USE_SECRET_MANAGER: "false"
      DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@postgres:5432/opssentinel
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started

  # Alert simulator — emits one signal on start; use `make storm` for the storm.
  alert-simulator:
    build:
      context: .
      dockerfile: services/alert-simulator/Dockerfile
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: opssentinel-mvp
      GOOGLE_CLOUD_PROJECT: opssentinel-mvp
      OPSSENTINEL_USE_SECRET_MANAGER: "false"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    restart: "no"

  # ADK agent — the reasoning brain (Phase 3). Pulls from the queue and drives the graph.
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: opssentinel-mvp
      GOOGLE_CLOUD_PROJECT: opssentinel-mvp
      OPSSENTINEL_USE_SECRET_MANAGER: "false"
      OPSSENTINEL_ALERTS_SUB: opssentinel-alerts-sub
      OPSSENTINEL_ACTIONS_TOPIC: opssentinel-actions
      CORRELATION_WINDOW_SECONDS: "10" # short window for local demo/validation (prod: 120)
      DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@postgres:5432/opssentinel
      MCP_ELASTIC_URL: http://mcp-elastic:8080/sse
      MCP_ARIZE_URL: http://mcp-arize:8081/sse
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # ADK / google-genai read GOOGLE_API_KEY and the Vertex flag (not GEMINI_API_KEY).
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
      GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
      # gemini-2.0-flash free tier was retired (limit:0); 2.5-flash is the current free flash model.
      # Set GEMINI_MODEL=gemini-2.0-flash once billing/paid quota is enabled to match the spec exactly.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SLACK_NOTIFY_URL: http://slack-bot:8080/notify
    depends_on:
      pubsub-emulator:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mcp-elastic:
        condition: service_started
      mcp-arize:
        condition: service_started

  # Slack HITL approval gate (Phase 5). The agent posts briefs here; Approve drives the executor.
  slack-bot:
    build:
      context: .
      dockerfile: services/slack-bot/Dockerfile
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: opssentinel-mvp
      GOOGLE_CLOUD_PROJECT: opssentinel-mvp
      OPSSENTINEL_USE_SECRET_MANAGER: "false"
      OPSSENTINEL_ACTIONS_TOPIC: opssentinel-actions
      DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@postgres:5432/opssentinel
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-changeme}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-changeme}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#opssentinel}
      DASHBOARD_BASE_URL: http://localhost:3000
    ports:
      - "8083:8080"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Next.js dashboard (mock data mode by default — no live agent needed for the UI/auth demo).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      OPSSENTINEL_DATA_MODE: live
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-changeme.apps.googleusercontent.com}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-session-secret-change-me}
      DATABASE_URL: postgresql://opssentinel:opssentinel@postgres:5432/opssentinel
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
