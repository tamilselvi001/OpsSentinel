# Alembic configuration for the OpsSentinel incident store.
# The database URL is NOT stored here — migrations/env.py resolves it at runtime via
# lib.secrets.get_secret("database-url") (Secret Manager on GCP, .env locally). No secret committed.

[alembic]
script_location = migrations
prepend_sys_path = .
# Placeholder only; overridden in env.py. Never put a real URL here.
sqlalchemy.url = postgresql+psycopg://localhost/opssentinel

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
