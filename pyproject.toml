[project]
name = "opssentinel"
version = "0.1.0"
description = "OpsSentinel — agentic AI incident-response platform (Phase 1 infrastructure foundation)"
# Deployment target is Python 3.12 (per spec; Dockerfiles use python:3.12-slim).
# requires-python is relaxed to 3.11 so the foundation can be linted/tested on the
# locally available interpreter without 3.12-only syntax. Code stays 3.11-compatible.
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "google-cloud-pubsub>=2.21",
    "google-cloud-secret-manager>=2.20",
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0", "python-dotenv>=1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "lib", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
